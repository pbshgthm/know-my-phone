name: Build Android APK

on:
  push:
    tags:
      - 'v*'  # e.g. v1.0.0 – builds and creates a release with APK
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:  # manual trigger from Actions tab
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for creating releases and uploading assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: 'android/build.gradle.kts'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build APK
        run: gradle assembleDebug --no-daemon
        # Debug build works out of the box; AGP creates keystore in CI.
        # For release signing, add keystore secrets and use assembleRelease.

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowMyPhone-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK for release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../KnowMyPhone-${{ github.ref_name }}.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../KnowMyPhone-latest.apk
          fi

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KnowMyPhone-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest release (on main push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          files: KnowMyPhone-latest.apk
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
